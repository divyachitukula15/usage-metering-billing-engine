# FlyRank Backend Track - Usage Metering & Billing Engine
# Start PostgreSQL first with: docker compose up -d

run: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "python -m app.seed"
test: "python -m pytest -q"
base_url: "http://127.0.0.1:8000"

endpoints:
  - method: GET
    path: /
  - method: POST
    path: /tenants/
  - method: POST
    path: /usage/
  - method: GET
    path: /usage/summary/{tenant_id}
  - method: POST
    path: /billing/checkout/{tenant_id}/{plan_id}
  - method: POST
    path: /webhooks/stripe
